services:
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chromadb
    volumes:
      - chroma-data:/chroma
    ports:
      - "8000:8000"
    command: ["run", "--host", "0.0.0.0", "--path", "/chroma"]
    environment:
      - ANONYMIZED_TELEMETRY=false

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  chroma-data:
  ollama-data:
